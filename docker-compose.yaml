  services:
    postgres-db:
      image: postgres:17
      container_name: postgres-db
      environment:
        POSTGRES_USER: myuser
        POSTGRES_PASSWORD: mypassword
        POSTGRES_DB: mydatabase
      ports:
        - "5432:5432"
      volumes:
        - postgres-data:/var/lib/postgresql/data
      restart: always

    postgrestest-db:
      image: postgres:17
      container_name: postgrestest-db
      environment:
        POSTGRES_USER: myuser
        POSTGRES_PASSWORD: mypassword
        POSTGRES_DB: mytestdatabase
      ports:
        - "5430:5432"
      volumes:
        - postgres-data:/var/lib/postgresql/data
      restart: always



    jobtracker:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: JobTrack
      ports:
      - "8080:8080"
      environment:
        DB_HOST: postgres-db
        DB_USER: myuser
        DB_PASSWORD: mypassword
        DB_NAME: mydatabase
      depends_on:
        - postgres-db
      restart: always


  volumes:
    postgres-data: